<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador GPS de Precisión</title>
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: sans-serif; background: #1a1a1a; }
        #map { width: 75%; height: 100vh; }
        #panel { width: 25%; padding: 20px; background: #2c3e50; color: white; height: 100vh; box-sizing: border-box; overflow-y: auto; border-left: 2px solid #34495e; }
        
        h2 { color: #2ecc71; margin-top: 0; font-size: 1.2rem; }
        label { display: block; margin-top: 10px; font-size: 0.85rem; font-weight: bold; }
        input[type="range"], input[type="text"], select { width: 100%; margin-top: 5px; }
        input[type="text"], select { padding: 8px; border-radius: 4px; border: none; box-sizing: border-box; font-size: 14px; }
        
        button { width: 100%; padding: 10px; margin-top: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        #btnBloquear { font-size: 1.1rem; padding: 12px; }
        
        /* Contenedor flexible para los botones de borrar */
        .contenedor-botones { display: flex; gap: 8px; margin-top: 10px; }
        .btn-mitad { width: 50%; padding: 10px; margin-top: 0 !important; font-size: 0.85rem; }
        #btnDeshacer { background: #34495e; }
        #btnBorrarUltimoLote { background: #e67e22; }
        #btnBorrarTodo { background: #e74c3c; margin-top: 10px; }
        
        #resultados { margin-top: 20px; background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 0.8rem; min-height: 150px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; max-height: 200px; }
        
        .etiqueta-lote { background-color: white; border-radius: 50%; color: #333; font-weight: bold; text-align: center; line-height: 24px; width: 24px !important; height: 24px !important; border: 1px solid #333; font-size: 12px; box-shadow: 1px 1px 4px rgba(0,0,0,0.5); }
        .mira-centro { position: absolute; top: 50%; left: 37.5%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; z-index: 1000; }
        .mira-centro::before, .mira-centro::after { content: ''; position: absolute; background: red; }
        .mira-centro::before { top: 9px; left: 0; width: 20px; height: 2px; }
        .mira-centro::after { top: 0; left: 9px; width: 2px; height: 20px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="mira-centro"></div>
    
    <div id="panel">
        <h2>Mapeador GPS de Precisión</h2>
        
        <p style="font-size: 0.8rem; color: #f1c40f; font-weight: bold;">
            🖱️ MODO ACTUAL: <span id="textoModo" style="color: white;">Moviendo Plano</span>
        </p>
        
        <button id="btnBloquear" style="background: #e67e22;">Bloquear para Dibujar 🔒</button>
        <hr style="border: 1px solid #34495e; margin: 15px 0;">

        <label>Ancho del Plano (Escala X):</label>
        <input type="range" id="anchoPlano" min="0.001" max="0.05" step="0.0001" value="0.008">

        <label>Alto del Plano (Escala Y):</label>
        <input type="range" id="altoPlano" min="0.001" max="0.05" step="0.0001" value="0.008">

        <label>Rotación del Plano (º):</label>
        <input type="range" id="rotacion" min="-180" max="180" step="0.5" value="0">

        <label>Transparencia del Plano:</label>
        <input type="range" id="transparencia" min="0" max="1" step="0.05" value="0.7">

        <hr style="border: 1px solid #34495e; margin: 15px 0;">

        <label>Prefijo del Lote:</label>
        <input type="text" id="prefijoLote" value="Manzana_1_Lote_">

        <label>Número de Lote (Vacío = Sin número):</label>
        <input type="text" id="numeroLote" value="1">

        <label>Estado del Terreno:</label>
        <select id="estadoLote">
            <option value="libre">Disponible (Verde claro)</option>
            <option value="vendido">Vendido (Rojo)</option>
            <option value="verde">Espacio Verde (Verde oscuro)</option>
        </select>

        <p style="font-size: 0.8rem; color: #5dade2; font-weight: bold; margin: 10px 0 0 0;" id="feedbackMagnetico">
            🧲 Imán Inteligente Activo
        </p>

        <h3 style="margin-top: 15px; font-size: 0.9rem; color: #f1c40f;" id="estadoClics">Esperando bloqueo...</h3>
        
        <!-- BOTONES DE CONTROL DE DIBUJO -->
        <div class="contenedor-botones">
            <button id="btnDeshacer" class="btn-mitad">Deshacer Clic</button>
            <button id="btnBorrarUltimoLote" class="btn-mitad">Borrar Último Lote</button>
        </div>
        <button id="btnBorrarTodo">Borrar TODO el mapa</button>

        <div id="resultados">Tus coordenadas GPS aparecerán aquí...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let centroInicial = L.latLng(-25.6644, -56.9602);
        const map = L.map('map').setView(centroInicial, 16); 
        
        L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 21,
            attribution: '© Google'
        }).addTo(map);

        let centroPlano = centroInicial;
        
        function obtenerLimites() {
            let ancho = parseFloat(document.getElementById('anchoPlano').value);
            let alto = parseFloat(document.getElementById('altoPlano').value);
            return [ [centroPlano.lat - alto, centroPlano.lng - ancho], [centroPlano.lat + alto, centroPlano.lng + ancho] ];
        }

        let planoOverlay = L.imageOverlay('plano.jpg', obtenerLimites(), { opacity: 0.7, interactive: true }).addTo(map);

        function actualizarTamanio() {
            planoOverlay.setBounds(obtenerLimites());
            aplicarRotacion();
        }
        document.getElementById('anchoPlano').addEventListener('input', actualizarTamanio);
        document.getElementById('altoPlano').addEventListener('input', actualizarTamanio);
        document.getElementById('transparencia').addEventListener('input', function(e) { planoOverlay.setOpacity(e.target.value); });

        const sliderRotacion = document.getElementById('rotacion');
        function aplicarRotacion() {
            if (planoOverlay) {
                let img = planoOverlay.getElement();
                if (img) {
                    let transformActual = img.style.transform.replace(/ rotate\(.*?\)/g, '');
                    img.style.transform = transformActual + ' rotate(' + sliderRotacion.value + 'deg)';
                }
            }
        }
        sliderRotacion.addEventListener('input', aplicarRotacion);
        map.on('moveend', aplicarRotacion);
        map.on('zoomend', aplicarRotacion);
        setTimeout(aplicarRotacion, 500);

        let planoBloqueado = false;
        let arrastrandoPlano = false;

        function actualizarCursores() {
            let img = planoOverlay.getElement();
            if (img) {
                if (planoBloqueado) {
                    img.style.cursor = 'crosshair';
                    document.getElementById('map').style.cursor = 'crosshair';
                } else {
                    img.style.cursor = 'move';
                    document.getElementById('map').style.cursor = 'grab';
                }
            }
        }
        setTimeout(actualizarCursores, 500);

        planoOverlay.on('mousedown', function(e) {
            if (planoBloqueado) return; 
            arrastrandoPlano = true;
            map.dragging.disable(); 
        });

        map.on('mousemove', function(e) {
            if (arrastrandoPlano) {
                centroPlano = e.latlng; 
                actualizarTamanio();
            }
        });

        map.on('mouseup', function(e) {
            if (arrastrandoPlano) {
                arrastrandoPlano = false;
                map.dragging.enable(); 
            }
        });

        const textoModo = document.getElementById('textoModo');
        const estadoClics = document.getElementById('estadoClics');
        
        document.getElementById('btnBloquear').addEventListener('click', function() {
            planoBloqueado = !planoBloqueado;
            actualizarCursores();
            if (planoBloqueado) {
                this.innerText = "Desbloquear (Para Mover) 🔓";
                this.style.background = "#3498db";
                textoModo.innerText = "Dibujando Terrenos";
                textoModo.style.color = "#2ecc71";
                
                let num = document.getElementById('numeroLote').value;
                estadoClics.innerText = `Mapeando: Lote ${num.trim() === "" ? "Sin Número" : num} (Clic ${puntosActuales.length + 1}/4)`;
            } else {
                this.innerText = "Bloquear para Dibujar 🔒";
                this.style.background = "#e67e22";
                textoModo.innerText = "Moviendo Plano";
                textoModo.style.color = "white";
                estadoClics.innerText = "Esperando bloqueo...";
                puntosActuales = []; 
                marcadoresTemporales.forEach(m => map.removeLayer(m));
                marcadoresTemporales = [];
            }
        });

        // ARREGLO GLOBAL PARA GUARDAR LA HISTORIA DE LOTES TERMINADOS (Permite deshacer)
        let lotesTerminados = []; 
        
        let puntosActuales = [];
        let marcadoresTemporales = [];
        let verticesExistentes = []; 
        const panelResultados = document.getElementById('resultados');
        const feedbackMagnetico = document.getElementById('feedbackMagnetico');

        map.on('click', function(e) {
            if (!planoBloqueado) {
                alert("Primero ubica el plano arrastrándolo con el mouse.\nLuego haz clic en 'Bloquear para Dibujar 🔒' para marcar los terrenos.");
                return;
            }

            let puntoFinal = e.latlng;
            let snapDistanciaPixeles = 15; 
            let seMagnetizo = false;

            verticesExistentes.forEach(function(v) {
                let pClick = map.latLngToContainerPoint(e.latlng);
                let pVertice = map.latLngToContainerPoint(v);
                let dist = pClick.distanceTo(pVertice);

                if (dist < snapDistanciaPixeles) {
                    puntoFinal = v; 
                    seMagnetizo = true;
                }
            });

            if (seMagnetizo) {
                feedbackMagnetico.innerText = "🧲 ¡Punto Imantado con Precisión!";
                feedbackMagnetico.style.color = "#2ecc71";
                setTimeout(() => {
                    feedbackMagnetico.innerText = "🧲 Imán Inteligente Activo";
                    feedbackMagnetico.style.color = "#5dade2";
                }, 1000);
            }

            puntosActuales.push(puntoFinal);
            let tempMarker = L.circleMarker(puntoFinal, {
                radius: seMagnetizo ? 4 : 2, 
                weight: 1, 
                color: seMagnetizo ? '#00ff00' : 'yellow', 
                fillOpacity: 1
            }).addTo(map);
            marcadoresTemporales.push(tempMarker);
            
            let num = document.getElementById('numeroLote').value;
            estadoClics.innerText = `Mapeando: Lote ${num.trim() === "" ? "Sin Número" : num} (Clic ${puntosActuales.length + 1}/4)`;

            if (puntosActuales.length === 4) {
                dibujarLote(puntosActuales, num);
                puntosActuales = []; 
                marcadoresTemporales.forEach(m => map.removeLayer(m));
                marcadoresTemporales = [];
                
                let sigLote = document.getElementById('numeroLote').value;
                estadoClics.innerText = `Mapeando: Lote ${sigLote.trim() === "" ? "Sin Número" : sigLote} (Clic 1/4)`;
            }
        });

        function dibujarLote(puntos, numLote) {
            let estado = document.getElementById('estadoLote').value;
            let colorFondo = estado === 'vendido' ? '#e74c3c' : (estado === 'verde' ? '#27ae60' : '#2ecc71'); 

            let poligono = L.polygon(puntos, {
                color: '#ffffff', weight: 1, dashArray: '4, 4', fillColor: colorFondo, fillOpacity: 0.5       
            }).addTo(map);

            puntos.forEach(p => verticesExistentes.push(p));
            let marcadorVisible = null;

            if (numLote.trim() !== "") {
                let centro = poligono.getBounds().getCenter();
                let iconoNumero = L.divIcon({ className: 'etiqueta-lote', html: numLote, iconSize: [24, 24], iconAnchor: [12, 12] });
                marcadorVisible = L.marker(centro, {icon: iconoNumero}).addTo(map);
                if(!isNaN(parseInt(numLote))) document.getElementById('numeroLote').value = parseInt(numLote) + 1;
            }

            let prefijo = document.getElementById('prefijoLote').value;
            let nombreCompleto = numLote.trim() === "" ? prefijo + "Sin_Numero" : prefijo + numLote;
            let textoCoords = `\n// ${nombreCompleto} (${estado.toUpperCase()})\n`;
            puntos.forEach((p, i) => { textoCoords += `P${i+1}: ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}\n`; });
            panelResultados.innerText += textoCoords;
            panelResultados.scrollTop = panelResultados.scrollHeight;

            // GUARDAR ESTE LOTE EN LA MEMORIA PARA PODER BORRARLO DESPUÉS
            lotesTerminados.push({
                poligonoShape: poligono,
                marcadorShape: marcadorVisible,
                textoAñadido: textoCoords,
                numeroOriginal: numLote
            });
        }

        // --- BOTÓN DESHACER CLIC (PUNTO POR PUNTO) ---
        document.getElementById('btnDeshacer').addEventListener('click', function() {
            if (puntosActuales.length > 0 && planoBloqueado) {
                puntosActuales.pop();
                let markerObj = marcadoresTemporales.pop();
                map.removeLayer(markerObj);
                let num = document.getElementById('numeroLote').value;
                estadoClics.innerText = `Mapeando: Lote ${num.trim() === "" ? "Sin Número" : num} (Clic ${puntosActuales.length + 1}/4)`;
            }
        });

        // --- NUEVO BOTÓN: BORRAR ÚLTIMO LOTE COMPLETO ---
        document.getElementById('btnBorrarUltimoLote').addEventListener('click', function() {
            if (lotesTerminados.length === 0) {
                alert("No hay lotes para borrar.");
                return;
            }

            // Sacamos el último lote de la lista
            let ultimoLote = lotesTerminados.pop();

            // 1. Borramos el dibujo (polígono) del mapa
            map.removeLayer(ultimoLote.poligonoShape);
            
            // 2. Borramos el numerito (si lo tenía)
            if (ultimoLote.marcadorShape) {
                map.removeLayer(ultimoLote.marcadorShape);
            }

            // 3. Borramos las coordenadas de la pantalla negra
            let textoActual = panelResultados.innerText;
            // Cortamos exactamente el texto que se le había añadido
            panelResultados.innerText = textoActual.slice(0, -ultimoLote.textoAñadido.length);

            // 4. Quitamos los últimos 4 puntos del imán (para que no atraiga hacia un lote que ya no existe)
            verticesExistentes.splice(-4, 4);

            // 5. Devolvemos el número de lote en la casilla para que vuelva a ser el mismo de antes
            document.getElementById('numeroLote').value = ultimoLote.numeroOriginal;
            
            let num = ultimoLote.numeroOriginal;
            estadoClics.innerText = `Mapeando: Lote ${num.trim() === "" ? "Sin Número" : num} (Clic 1/4)`;
        });

        // --- BOTÓN BORRAR TODO (RESETEO) ---
        document.getElementById('btnBorrarTodo').addEventListener('click', function() {
            if(confirm('¿Seguro que quieres borrar todo el mapa y empezar de cero?')) location.reload(); 
        });
    </script>
</body>
</html>
