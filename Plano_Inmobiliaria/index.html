<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbanización Sapucai - Lotes</title>
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f7; }
        
        #map { width: 70%; height: 100vh; }
        
        #panel { width: 30%; background: white; padding: 30px; box-sizing: border-box; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.1); z-index: 1000; }
        
        h1 { color: #2c3e50; font-size: 1.8rem; margin-top: 0; }
        p { color: #7f8c8d; line-height: 1.6; }
        
        .leyenda { background: #f8f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e5e8e8; }
        .leyenda-item { display: flex; align-items: center; margin-bottom: 10px; font-weight: bold; color: #34495e; }
        .caja-color { width: 20px; height: 20px; margin-right: 10px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.2); }
        .color-libre { background: #2ecc71; }
        .color-vendido { background: #e74c3c; }
        .color-verde { background: #27ae60; }
        
        .btn-maps { display: block; width: 100%; background: #4285F4; color: white; text-align: center; padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; transition: 0.3s; box-sizing: border-box; }
        .btn-maps:hover { background: #3367d6; box-shadow: 0 4px 8px rgba(66, 133, 244, 0.4); }
        
        .btn-whatsapp { display: block; width: 100%; background: #25D366; color: white; text-align: center; padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 15px; transition: 0.3s; box-sizing: border-box; }
        .btn-whatsapp:hover { background: #1ebe57; box-shadow: 0 4px 8px rgba(37, 211, 102, 0.4); }

        /* Vuelve el círculo blanco limpio solo con el número */
        .etiqueta-lote { background-color: white; border-radius: 50%; color: #333; font-weight: bold; text-align: center; line-height: 24px; width: 24px !important; height: 24px !important; border: 1px solid #333; font-size: 12px; box-shadow: 1px 1px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="panel">
        <h1>Loteamiento Sapucai</h1>
        <p>Descubre tu próximo terreno. Contamos con lotes con posesión inmediata, rodeados de naturaleza y con excelente ubicación estratégica.</p>
        
        <div class="leyenda">
            <div class="leyenda-item">
                <div class="caja-color color-libre"></div> Lotes Disponibles
            </div>
            <div class="leyenda-item">
                <div class="caja-color color-vendido"></div> Lotes Vendidos
            </div>
            <div class="leyenda-item">
                <div class="caja-color color-verde"></div> Espacios Verdes
            </div>
        </div>

        <a href="https://www.google.com/maps/search/?api=1&query=-25.668092,-56.938836" target="_blank" class="btn-maps">
            📍 Abrir en Google Maps
        </a>
        
        <a href="https://wa.me/595900000000?text=Hola,%20me%20interesa%20un%20lote%20en%20Sapucai" target="_blank" class="btn-whatsapp">
            💬 Consultar Disponibilidad
        </a>
    </div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 21, attribution: '© Google'
        }).addTo(map);

        const textoCoordenadas = `
// Manzana_1_Lote_1 (LIBRE)
P1: -25.668092, -56.938836
P2: -25.668149, -56.938577
P3: -25.667981, -56.938516
P4: -25.667924, -56.938774

// Manzana_1_Lote_2 (LIBRE)
P1: -25.667924, -56.938774
P2: -25.667755, -56.938713
P3: -25.667810, -56.938455
P4: -25.667981, -56.938516

// Manzana_1_Lote_3 (LIBRE)
P1: -25.668166, -56.938499
P2: -25.667938, -56.938417
P3: -25.667984, -56.938211
P4: -25.668214, -56.938287

// Manzana_1_Lote_4 (LIBRE)
P1: -25.667709, -56.938333
P2: -25.667938, -56.938417
P3: -25.667984, -56.938211
P4: -25.667752, -56.938132

// Manzana_1_Lote_5 (LIBRE)
P1: -25.668236, -56.938181
P2: -25.668007, -56.938103
P3: -25.668054, -56.937895
P4: -25.668284, -56.937968

// Manzana_1_Lote_6 (LIBRE)
P1: -25.667777, -56.938023
P2: -25.667820, -56.937820
P3: -25.668054, -56.937895
P4: -25.668007, -56.938103

// Manzana_1_Lote_7 (LIBRE)
P1: -25.668128, -56.937838
P2: -25.668298, -56.937893
P3: -25.668355, -56.937635
P4: -25.668186, -56.937579

// Manzana_1_Lote_8 (LIBRE)
P1: -25.667956, -56.937783
P2: -25.668128, -56.937838
P3: -25.668186, -56.937579
P4: -25.668014, -56.937525

// Manzana_1_Lote_9 (LIBRE)
P1: -25.667956, -56.937783
P2: -25.667784, -56.937729
P3: -25.667840, -56.937468
P4: -25.668014, -56.937525

// Manzana_1_Lote_10 (LIBRE)
P1: -25.667784, -56.937729
P2: -25.667612, -56.937673
P3: -25.667669, -56.937413
P4: -25.667840, -56.937468

// Manzana_1_Lote_11 (LIBRE)
P1: -25.667820, -56.937820
P2: -25.667777, -56.938023
P3: -25.667535, -56.937942
P4: -25.667580, -56.937747
        `;

        function dibujarLotesParaCliente(texto) {
            let bloques = texto.split('//').filter(b => b.trim() !== '');
            let todosLosPuntos = []; 

            bloques.forEach(bloque => {
                let lineas = bloque.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '');
                if (lineas.length === 0) return;

                let titulo = lineas[0];
                let estado = titulo.includes('VENDIDO') ? 'vendido' : (titulo.includes('VERDE') ? 'verde' : 'libre');
                
                let numeroMatch = titulo.match(/Lote_(\d+)/i) || titulo.match(/(\d+)/);
                let numLote = numeroMatch ? numeroMatch[1] : "";

                let puntos = [];
                for(let i = 1; i < lineas.length; i++) {
                    if(lineas[i].match(/^P\d+:/)) {
                        let coords = lineas[i].split(':')[1].split(',');
                        let lat = parseFloat(coords[0]);
                        let lng = parseFloat(coords[1]);
                        puntos.push([lat, lng]);
                        todosLosPuntos.push([lat, lng]);
                    }
                }

                if (puntos.length >= 3) {
                    let colorFondo = estado === 'vendido' ? '#e74c3c' : (estado === 'verde' ? '#27ae60' : '#2ecc71');

                    let poligono = L.polygon(puntos, {
                        color: '#ffffff', weight: 2, dashArray: '4, 4', fillColor: colorFondo, fillOpacity: 0.6
                    }).addTo(map);

                    if (numLote !== "") {
                        let centro = poligono.getBounds().getCenter();
                        let iconoNumero = L.divIcon({ className: 'etiqueta-lote', html: numLote, iconSize: [24, 24], iconAnchor: [12, 12] });
                        L.marker(centro, {icon: iconoNumero}).addTo(map);
                    }
                }
            });

            if(todosLosPuntos.length > 0) {
                map.fitBounds(L.latLngBounds(todosLosPuntos));
            }
        }

        dibujarLotesParaCliente(textoCoordenadas);
    </script>
</body>
</html>
