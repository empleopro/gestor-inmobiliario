<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Gerencial Propietario | Loteamiento Sapucai</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #065f46;
            --danger: #991b1b;
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111827; color: var(--text-main); height: 100vh; overflow: hidden; }
        
        #map { width: 55%; height: 100vh; }
        
        #panel { 
            width: 45%; 
            background: var(--bg-panel); 
            padding: 15px; 
            box-sizing: border-box; 
            overflow-y: auto; 
            border-left: 1px solid #374151;
            z-index: 1000; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .header-panel h1 { color: #38bdf8; font-size: 1.1rem; font-weight: 600; margin: 0 0 3px 0; }
        .header-panel p { color: var(--text-muted); font-size: 0.75rem; line-height: 1.2; margin-bottom: 10px; }

        .admin-box { background: #111827; padding: 12px; border-radius: 6px; border: 1px solid #374151; margin-bottom: 10px; }
        .admin-box h3 { margin: 0 0 8px 0; font-size: 0.85rem; color: #38bdf8; }
        
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; }
        .form-control { width: 100%; padding: 6px 8px; box-sizing: border-box; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 4px; font-size: 0.8rem; }
        
        .btn-accion { background: #2563eb; color: white; border: none; width: 100%; padding: 8px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
        .btn-accion:hover { background: #1d4ed8; }
        
        .btn-pdf { background: #059669; color: white; border: none; width: 100%; padding: 8px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; margin-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; background: #111827; border-radius: 4px; overflow: hidden; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #374151; }
        th { background: #374151; color: #38bdf8; font-weight: 600; }

        .badge { padding: 2px 5px; border-radius: 3px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        .badge.vendido { background: #991b1b; color: #fca5a5; }
        .badge.recuperado { background: #f59e0b; color: #000; }
        .badge.libre { background: #065f46; color: #6ee7b7; }

        .etiqueta-lote { 
            background: rgba(17, 24, 39, 0.9); border-radius: 4px; color: white; font-weight: 700; 
            text-align: center; line-height: 22px; width: 28px !important; height: 22px !important; 
            border: 1px solid rgba(255,255,255,0.3); font-size: 12px; 
        }

        .footer-marca { text-align: center; font-size: 0.65rem; color: var(--text-muted); margin-top: 10px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #map { width: 100%; height: 40vh; }
            #panel { width: 100%; height: 60vh; padding: 12px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="panel">
        <div>
            <div class="header-panel">
                <h1>Panel Gerencial (Propietario)</h1>
                <p>Toque un lote para editar su precio o cambiar estado a Recuperado.</p>
            </div>

            <!-- CUADRO DE EDICIÓN DEL PROPIETARIO -->
            <div class="admin-box">
                <h3 id="tituloEdicion">✏️ Seleccione un lote del mapa para editar</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Precio del Lote</label>
                        <input type="text" id="editPrecio" class="form-control" placeholder="Ej: Gs. 120.000.000">
                    </div>
                    <div class="form-group">
                        <label>Estado del Lote</label>
                        <select id="editEstado" class="form-control">
                            <option value="libre">🟢 Disponible / Libre</option>
                            <option value="recuperado">🟡 Recuperado</option>
                            <option value="vendido">🔴 Vendido</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn-accion" onclick="guardarCambiosPropietario()">💾 Actualizar Lote en Tiempo Real</button>
            </div>

            <button type="button" class="btn-pdf" onclick="window.print()">📥 Imprimir / Descargar Reporte PDF</button>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Lote</th>
                            <th>Estado</th>
                            <th>Precio</th>
                            <th>Vendedor</th>
                            <th>Cliente</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #9ca3af;">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer-marca">Centro de Control Gerencial - Sapucai</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const map = L.map('map', { zoomControl: false });
        L.control.zoom({ position: 'topleft' }).addTo(map);

        L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 21, attribution: '© Google Maps'
        }).addTo(map);

        const textoCoordenadas = `
// Manzana_1_Lote_1
P1: -25.668092, -56.938836
P2: -25.668149, -56.938577
P3: -25.667981, -56.938516
P4: -25.667924, -56.938774

// Manzana_1_Lote_2
P1: -25.667924, -56.938774
P2: -25.667755, -56.938713
P3: -25.667810, -56.938455
P4: -25.667981, -56.938516

// Manzana_1_Lote_3
P1: -25.668166, -56.938499
P2: -25.667938, -56.938417
P3: -25.667984, -56.938211
P4: -25.668214, -56.938287

// Manzana_1_Lote_4
P1: -25.667709, -56.938333
P2: -25.667938, -56.938417
P3: -25.667984, -56.938211
P4: -25.667752, -56.938132

// Manzana_1_Lote_5
P1: -25.668235, -56.938181
P2: -25.668008, -56.938103
P3: -25.668054, -56.937898
P4: -25.668284, -56.937968

// Manzana_1_Lote_6
P1: -25.668008, -56.938103
P2: -25.668054, -56.937898
P3: -25.667819, -56.937820
P4: -25.667776, -56.938023

// Manzana_1_Lote_7
P1: -25.667776, -56.938023
P2: -25.667819, -56.937820
P3: -25.667582, -56.937744
P4: -25.667537, -56.937942

// Manzana_1_Lote_8
P1: -25.667784, -56.937728
P2: -25.667839, -56.937472
P3: -25.667669, -56.937414
P4: -25.667612, -56.937671

// Manzana_1_Lote_9
P1: -25.667784, -56.937728
P2: -25.667839, -56.937472
P3: -25.668014, -56.937527
P4: -25.667956, -56.937781

// Manzana_1_Lote_10
P1: -25.667956, -56.937781
P2: -25.668014, -56.937527
P3: -25.668186, -56.937579
P4: -25.668132, -56.937839

// Manzana_1_Lote_11
P1: -25.668186, -56.937579
P2: -25.668132, -56.937839
P3: -25.668298, -56.937895
P4: -25.668356, -56.937638
        `;

        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com",
            projectId: "gestorinmobiliario-d68b3",
            storageBucket: "gestorinmobiliario-d68b3.firebasestorage.app",
            messagingSenderId: "927434078075",
            appId: "1:927434078075:web:95bd3c4e6720bcd282afde"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let poligonosDibujados = {};
        let loteSeleccionadoAdmin = "";

        function dibujarLotesBase(texto) {
            let bloques = texto.split('//').filter(b => b.trim() !== '');
            let todosLosPuntos = []; 

            bloques.forEach(bloque => {
                let lineas = bloque.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '');
                if (lineas.length === 0) return;

                let titulo = lineas[0];
                let nombreLote = titulo.trim();
                let numeroMatch = nombreLote.match(/Lote_(\d+)/i) || nombreLote.match(/(\d+)/);
                let numLote = numeroMatch ? numeroMatch[1] : "";

                let puntos = [];
                for(let i = 1; i < lineas.length; i++) {
                    if(lineas[i].match(/^P\d+:/)) {
                        let coords = lineas[i].split(':')[1].split(',');
                        let lat = parseFloat(coords[0]);
                        let lng = parseFloat(coords[1]);
                        puntos.push([lat, lng]);
                        todosLosPuntos.push([lat, lng]);
                    }
                }

                if (puntos.length >= 3) {
                    // Alta sensibilidad táctil con borde más grueso y mayor opacidad
                    let poligono = L.polygon(puntos, {
                        color: '#ffffff', weight: 2, dashArray: '3, 3', fillColor: '#10b981', fillOpacity: 0.65
                    }).addTo(map);

                    poligono.on('click', function(e) {
                        loteSeleccionadoAdmin = nombreLote;
                        document.getElementById('tituloEdicion').innerText = `✏️ Editando: ${nombreLote.replace('_', ' ')}`;

                        const refLote = ref(db, 'lotes/' + nombreLote);
                        onValue(refLote, (snapshot) => {
                            const datos = snapshot.val() || {};
                            document.getElementById('editPrecio').value = datos.precio || "Gs. 120.000.000";
                            document.getElementById('editEstado').value = datos.estado || "libre";
                        }, { onlyOnce: true });
                    });

                    poligonosDibujados[nombreLote] = poligono;

                    if (numLote !== "") {
                        let centro = poligono.getBounds().getCenter();
                        let iconoNumero = L.divIcon({ className: 'etiqueta-lote', html: numLote, iconSize: [28, 22], iconAnchor: [14, 11] });
                        L.marker(centro, {icon: iconoNumero}).addTo(map);
                    }
                }
            });

            if(todosLosPuntos.length > 0) {
                map.fitBounds(L.latLngBounds(todosLosPuntos), { padding: [30, 30] });
            }
        }

        dibujarLotesBase(textoCoordenadas);

        const referenciaTodosLosLotes = ref(db, 'lotes');
        onValue(referenciaTodosLosLotes, (snapshot) => {
            const lotesEnBaseDeDatos = snapshot.val() || {};
            let htmlTabla = '';

            for (let nombreLote in poligonosDibujados) {
                let datosLote = lotesEnBaseDeDatos[nombreLote] || {};
                let estado = datosLote.estado || 'libre';
                let precio = datosLote.precio || 'Gs. 120.000.000';
                let vendedor = datosLote.vendedor || '-';
                let cliente = datosLote.cliente || 'Disponible / Libre';

                let claseBadge = 'libre';
                let textoBadge = 'Disponible';

                if (estado === 'vendido') {
                    poligonosDibujados[nombreLote].setStyle({ fillColor: '#ef4444' });
                    claseBadge = 'vendido';
                    textoBadge = 'Vendido';
                } else if (estado === 'recuperado') {
                    poligonosDibujados[nombreLote].setStyle({ fillColor: '#f59e0b' });
                    claseBadge = 'recuperado';
                    textoBadge = 'Recuperado';
                } else {
                    poligonosDibujados[nombreLote].setStyle({ fillColor: '#10b981' });
                    cliente = 'Disponible / Libre';
                    vendedor = '-';
                }

                let nombreCorto = nombreLote.replace('Manzana_', 'Mza ').replace('_Lote_', ' - L.: ');

                htmlTabla += `
                    <tr>
                        <td><b>${nombreCorto}</b></td>
                        <td><span class="badge ${claseBadge}">${textoBadge}</span></td>
                        <td>${precio}</td>
                        <td>${vendedor}</td>
                        <td>${cliente}</td>
                    </tr>
                `;
            }

            document.getElementById('tablaCuerpo').innerHTML = htmlTabla;
        });

        window.guardarCambiosPropietario = function() {
            if (!loteSeleccionadoAdmin) {
                alert("Por favor seleccione un lote haciendo clic en el mapa primero.");
                return;
            }

            const nuevoPrecio = document.getElementById('editPrecio').value;
            const nuevoEstado = document.getElementById('editEstado').value;

            const refLote = ref(db, 'lotes/' + loteSeleccionadoAdmin);
            
            update(refLote, {
                precio: nuevoPrecio,
                estado: nuevoEstado
            }).then(() => {
                alert("¡Lote actualizado correctamente por la gerencia!");
            }).catch((error) => {
                alert("Error al actualizar: " + error.message);
            });
        };
    </script>
</body>
</html>
