<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Obras | Clientes para Murallas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .grid-clientes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .tarjeta-cliente { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
        .lote-titulo { font-weight: bold; font-size: 1.1rem; color: #10b981; margin-bottom: 5px; }
        .info { font-size: 0.9rem; color: #cbd5e1; margin: 3px 0; }
        .btn-wa { display: block; background: #25D366; color: white; text-align: center; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 12px; }
        .btn-wa:hover { background: #1eb854; }
        .badge { background: #0284c7; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body>

    <h1>🔨 Registro de Nuevos Compradores para Murallas</h1>
    <p>Lista automatizada de clientes que compraron terrenos para ofrecer prefabricados de hormigón.</p>

    <div id="lista-clientes" class="grid-clientes">
        <!-- Los clientes aparecerán aquí dinámicamente -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com",
            projectId: "gestorinmobiliario-d68b3",
            storageBucket: "gestorinmobiliario-d68b3.firebasestorage.app",
            messagingSenderId: "927434078075",
            appId: "1:927434078075:web:95bd3c4e6720bcd282afde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const contenedor = document.getElementById('lista-clientes');

        const referenciaLotes = ref(db, 'lotes');

        onValue(referenciaLotes, (snapshot) => {
            const lotes = snapshot.val();
            contenedor.innerHTML = '';

            if (!lotes) {
                contenedor.innerHTML = '<p>No hay lotes registrados aún.</p>';
                return;
            }

            for (let idLote in lotes) {
                const datos = lotes[idLote];

                // Solo nos interesan los vendidos que tengan datos de contacto
                if (datos.estado === 'vendido' && datos.telefono) {
                    const nombreLoteLindo = idLote.replace('Manzana_', 'Manzana ').replace('_Lote_', ' - Lote ');
                    
                    // Limpiamos el número de teléfono para WhatsApp
                    let numLimpio = datos.telefono.replace(/[^0-9]/g, '');
                    if (!numLimpio.startsWith('595')) {
                        numLimpio = '595' + (numLimpio.startsWith('0') ? numLimpio.substring(1) : numLimpio);
                    }

                    // Mensaje personalizado para WhatsApp
                    const mensaje = `Hola ${datos.comprador || ''}, ¡felicidades por la compra de tu terreno (${nombreLoteLindo})! Te contacto de la fábrica de prefabricados de hormigón. Fabricamos e instalamos placas y columnas H para cercado perimetral. ¿Te gustaría un presupuesto rápido sin compromiso para cerrar tu terreno?`;

                    const urlWa = `https://wa.me/${numLimpio}?text=${encodeURIComponent(mensaje)}`;

                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-cliente';
                    tarjeta.innerHTML = `
                        <div class="lote-titulo">📍 ${nombreLoteLindo}</div>
                        <div class="info">👤 <b>Comprador:</b> ${datos.comprador || 'No registrado'}</div>
                        <div class="info">📞 <b>Teléfono:</b> ${datos.telefono}</div>
                        <div class="info">📅 <b>Fecha Venta:</b> ${datos.fecha_registro || 'Reciente'}</div>
                        <a href="${urlWa}" target="_blank" class="btn-wa">📲 Enviar Oferta por WhatsApp</a>
                    `;
                    contenedor.appendChild(tarjeta);
                }
            }
        });
    </script>
</body>
</html>
